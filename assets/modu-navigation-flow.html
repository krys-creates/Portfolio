<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MODU Navigation Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

<!-- ===== STANDALONE PREVIEW ONLY: page chrome. Not needed when pasted into the site. ===== -->
<style>
  body{
    margin:0;
    background:var(--color-bg,#F8F6F0);
    padding:clamp(1.25rem,4vw,3rem);
  }
  .preview-wrap{ max-width:1054px; margin:0 auto; }
</style>

<!-- ===== COPY FROM HERE: 1/2 — styles (all selectors are prefixed .ufn) ===== -->
<style>
  .ufn{
    --ufn-bg:var(--color-bg,#F8F6F0);
    --ufn-ink:var(--color-text,#171412);
    --ufn-dark:var(--color-dark,#44403C);
    --ufn-muted:var(--color-text-muted,#716B60);
    --ufn-red:var(--color-orange-text,#C23636);
    --ufn-red-pale:var(--color-orange-decoration,#F6CBC7);
    --ufn-line:rgba(23,20,18,.32);
    margin:0;
    color:var(--ufn-ink);
    font-family:var(--font-mono,'JetBrains Mono','Courier New',monospace);
  }
  .ufn__scroll{ overflow-x:auto; padding-bottom:.5rem; }
  .ufn__svg{ display:block; width:100%; min-width:900px; height:auto; }

  .ufn .t-title{ font-family:var(--font-heading,'Roboto Mono','Courier New',monospace); font-size:14.5px; font-weight:700; fill:var(--ufn-ink); text-anchor:middle; }
  .ufn .t-title--lg{ font-size:16px; }
  .ufn .t-sub{ font-size:11px; fill:var(--ufn-muted); text-anchor:middle; }
  .ufn .k-hub .t-title{ fill:#FFFFFF; }
  .ufn .k-hub .t-sub{ fill:#E6E1D6; }

  .ufn .t-sec{ font-size:11.5px; letter-spacing:.08em; fill:var(--ufn-muted); }
  .ufn .t-sec__k{ font-weight:700; fill:var(--ufn-red); }
  .ufn .t-edge,.ufn .t-note,.ufn .t-cap{ font-size:11.5px; paint-order:stroke; stroke:var(--ufn-bg); stroke-width:6px; stroke-linejoin:round; }
  .ufn .t-edge{ fill:var(--ufn-red); font-weight:500; }
  .ufn .t-note{ fill:var(--ufn-muted); font-style:italic; }
  .ufn .t-cap{ fill:var(--ufn-muted); }

  .ufn .bd{ stroke-width:1.25; }
  .ufn .k-onb .bd{ fill:#FFFFFF; stroke:var(--ufn-line); }
  .ufn .k-route .bd,.ufn .k-tut .bd{ fill:#FFFFFF; stroke:var(--ufn-dark); }
  .ufn .k-tut .bd{ fill:#ECE7DA; }
  .ufn .sh{ fill:var(--ufn-red-pale); }
  .ufn .k-hub .bd{ fill:var(--ufn-dark); stroke:var(--ufn-dark); }
  .ufn .ghost{ fill:none; stroke:var(--ufn-dark); stroke-opacity:.35; stroke-width:1.25; }
  .ufn .k-modal .bd{ fill:rgba(255,255,255,.55); stroke:var(--ufn-muted); stroke-dasharray:5 4; }
  .ufn .handle{ fill:#E4DFD3; stroke:var(--ufn-muted); stroke-width:1; }

  .ufn .e-push{ fill:none; stroke:var(--ufn-red); stroke-width:1.75; }
  .ufn .e-over{ fill:none; stroke:var(--ufn-muted); stroke-width:1.5; stroke-dasharray:5 4; }
  .ufn .e-return{ fill:none; stroke:var(--ufn-muted); stroke-width:1.9; stroke-dasharray:.1 6; stroke-linecap:round; }
  .ufn .e-dot{ fill:var(--ufn-muted); }
  .ufn .ah-red{ fill:var(--ufn-red); }
  .ufn .ah-muted{ fill:var(--ufn-muted); }

  .ufn__legend{
    list-style:none; margin:1.6rem 0 0; padding:1.1rem 0 0;
    border-top:1px solid var(--ufn-line);
    display:flex; flex-wrap:wrap; gap:.9rem 2.4rem;
    font-size:.82rem; line-height:1.4;
  }
  .ufn__legend li{ display:flex; align-items:center; gap:.7rem; }
  .ufn__legend strong{ font-weight:700; }
  .ufn__legend .txt{ color:var(--ufn-muted); }
  .ufn__legend .txt strong{ color:var(--ufn-ink); }
  .ufn__sw{ flex:none; width:34px; height:18px; box-sizing:border-box; }
  .ufn__sw--onb{ background:#FFFFFF; border:1.25px solid var(--ufn-line); }
  .ufn__sw--hub{ background:var(--ufn-dark); border:1.25px solid var(--ufn-dark); }
  .ufn__sw--route{ background:#FFFFFF; border:1.25px solid var(--ufn-dark); box-shadow:3px 3px 0 var(--ufn-red-pale); }
  .ufn__sw--modal{ background:rgba(255,255,255,.55); border:1.25px dashed var(--ufn-muted); }
  .ufn__ln{ flex:none; width:34px; height:0; border-top:2px solid var(--ufn-red); }
  .ufn__ln--over{ border-top:2px dashed var(--ufn-muted); }
</style>
</head>
<body>
<div class="preview-wrap">
